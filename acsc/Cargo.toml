[package]
name = "acsc"
version = "0.1.0"
edition = "2024"
description = "Agent commit skill command"

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive", "string"] }
clap_complete = { version = "4.6", features = ["unstable-dynamic"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"

[dev-dependencies]
tempfile = "3"
